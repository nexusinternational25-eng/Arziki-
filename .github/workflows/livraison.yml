# Livraison automatique d'ARZIKI (CLAUDE.md, section 16, option B).
#
# À chaque push sur main ou sur une branche de travail claude/** :
#   1. analyse et tests (application, Cloud Functions, règles de sécurité) ;
#   2. construction de l'APK Android et des deux versions web (application et console) ;
#   3. publication sur la branche « livraison », affichée par Vercel :
#        /ARZIKI.apk   l'application Android à télécharger
#        /app/         l'application dans le navigateur
#        /console/     la console d'administration
#
# Signature : si les secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS et
# KEY_PASSWORD existent, l'APK est signé avec la clé officielle ; sinon avec une
# clé de test (suffisant pour essayer, pas pour Google Play).

name: Livraison

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de l'application"
        type: choice
        options: [demo, prod]
        default: demo

permissions:
  contents: write

concurrency:
  group: livraison
  cancel-in-progress: true

jobs:
  verifier:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cloud Functions et règles de sécurité
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test
          npm run test:regles

  livrer:
    name: APK, web et publication
    needs: verifier
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/arziki-release.jks
            {
              echo "storeFile=arziki-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "Pas de clé de signature : APK signé avec la clé de test."
          fi

      - name: Configuration Firebase
        if: env.MODE == 'prod'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Le mode production demande le secret GOOGLE_SERVICES_JSON."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - run: flutter pub get

      - name: APK Android
        run: |
          # Téléphones Android (processeurs ARM 32 et 64 bits) : APK plus léger.
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --dart-define-from-file=config/firebase.json \
            --dart-define=APP_MODE=$MODE

      - name: Application web et console web
        run: |
          flutter build web --release --no-web-resources-cdn --base-href /app/ \
            --dart-define-from-file=config/firebase.json --dart-define=APP_MODE=$MODE --dart-define=CIBLE=mobile \
            -o build/site-app
          flutter build web --release --no-web-resources-cdn --base-href /console/ \
            --dart-define-from-file=config/firebase.json --dart-define=APP_MODE=$MODE --dart-define=CIBLE=console \
            -o build/site-console

      - name: Assembler le site
        run: |
          mkdir -p site
          cp livraison/index.html livraison/vercel.json site/
          cp assets/logo/arziki_logo.png site/logo.png
          cp assets/logo/arziki_logo_blanc.png site/logo_blanc.png
          mkdir -p site/images
          for i in ambiance_marche accueil_livraison_chantier services_conseil services_analyse \
                   accueil_dirigeante_signature ambiance_equipe partenariat_reunion_investisseurs \
                   cercle_diaspora partenariat_port; do
            cp assets/images/$i.jpg site/images/
          done
          cp build/app/outputs/flutter-apk/app-release.apk site/ARZIKI.apk
          cp -r build/site-app site/app
          cp -r build/site-console site/console
          # Fichiers inutiles en ligne (symboles de débogage)
          find site -name '*.symbols' -delete
          # Adresse relative : le site marche à la racine (Vercel) comme dans un
          # sous-dossier (GitHub Pages : /Arziki-/).
          sed -i 's#<base href="/app/">#<base href="./">#' site/app/index.html
          sed -i 's#<base href="/console/">#<base href="./">#' site/console/index.html
          touch site/.nojekyll
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          TAILLE="$(( $(stat -c%s site/ARZIKI.apk) / 1048576 )) Mo"
          # Date en toutes lettres : 1er novembre 2026
          MOIS=(janvier février mars avril mai juin juillet août septembre octobre novembre décembre)
          JOUR=$(TZ=Africa/Lome date +%-d); [ "$JOUR" = "1" ] && JOUR="1er"
          DATE="$JOUR ${MOIS[$(( $(TZ=Africa/Lome date +%-m) - 1 ))]} $(TZ=Africa/Lome date +%Y)"
          sed -i "s#__VERSION__#$VERSION#; s#__TAILLE__#$TAILLE#; s#__DATE__#$DATE#" site/index.html
          echo "commit=${GITHUB_SHA}" > site/version-livraison.txt
          ls -la site

      - name: Publier sur la branche livraison
        run: |
          cd site
          git init -q -b livraison
          git config user.name "ARZIKI livraison"
          git config user.email "livraison@users.noreply.github.com"
          git add -A
          git commit -q -m "Livraison de ${GITHUB_SHA::7} ($MODE)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" livraison

      # Lien public et stable, sans compte GitHub :
      # https://github.com/<dépôt>/releases/latest/download/ARZIKI.apk
      - name: Publier l'APK (release GitHub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete demo --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create demo site/ARZIKI.apk \
            --repo "${{ github.repository }}" \
            --target "${GITHUB_SHA}" \
            --title "ARZIKI, version de démonstration" \
            --notes "Application Android ARZIKI en mode démonstration (données fictives). Code SMS : 123456. Construite le $(TZ=Africa/Lome date +'%d/%m/%Y à %Hh%M')." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: arziki-${{ env.MODE }}-${{ github.run_number }}
          path: site/ARZIKI.apk
          retention-days: 30
